<header class="topbar">
  <a class="brand" routerLink="/tracks">
    <span class="brand-logo"><app-icon name="headphones" /></span>
    <span class="brand-text">
      <b>Guitar Practice Cloud</b>
      <small>Le cloud qui manque à votre ampli</small>
    </span>
  </a>

  <nav aria-label="Navigation principale">
    <a class="nav-link" routerLink="/tracks" routerLinkActive="active" ariaCurrentWhenActive="page">
      <app-icon name="music" /><span class="nav-label">Backing tracks</span>
    </a>
    <a class="nav-link" routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">
      <app-icon name="user" /><span class="nav-label">Profil</span>
    </a>
    <button
      type="button"
      class="nav-link theme-toggle"
      [class.active]="visualizer.enabled()"
      (click)="visualizer.toggle()"
      [attr.aria-pressed]="visualizer.enabled()"
      aria-label="Fond animé au rythme de la musique"
      [attr.title]="
        (visualizer.enabled() ? 'Désactiver' : 'Activer') +
        ' le fond animé (visualiseur MilkDrop). Peut contenir des effets lumineux rapides.'
      "
    >
      <app-icon name="sparkles" />
    </button>
    @let dark = theme.theme() === 'dark';
    <button
      type="button"
      class="nav-link theme-toggle"
      (click)="theme.toggle()"
      [attr.aria-label]="dark ? 'Activer le mode clair' : 'Activer le mode sombre'"
      [attr.title]="dark ? 'Mode clair' : 'Mode sombre'"
    >
      <app-icon [name]="dark ? 'sun' : 'moon'" />
    </button>
    @if (auth.isAuthenticated()) {
      <button type="button" class="nav-link nav-cta" (click)="logout()">
        <app-icon name="logout" /><span class="nav-label">Déconnexion</span>
      </button>
    } @else {
      <a class="nav-link nav-cta" routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">
        <app-icon name="login" /><span class="nav-label">Connexion</span>
      </a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<!-- Animated MilkDrop background, behind the whole page. -->
<app-visualizer-background />
